name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20.19', '22', '24']
        include:
          # One Windows run: it catches shebang and path-separator problems
          # that never show up on Linux.
          - os: windows-latest
            node: '22'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The unit suite stubs the network to throw, so an upstream outage can
      # never redden this build.
      - run: npm test
      - run: npm run build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Install the tarball the way a user would, and check the bin runs.
      - run: |
          npm pack
          mkdir -p /tmp/install-check && cd /tmp/install-check
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/mcp-fek-*.tgz
          ./node_modules/.bin/fek-mcp --version
          ./node_modules/.bin/fek-mcp --help
